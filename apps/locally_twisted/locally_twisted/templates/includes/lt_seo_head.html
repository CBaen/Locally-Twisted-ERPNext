{% if lt_canonical_url %}
<link rel="canonical" href="{{ lt_canonical_url }}">
{% endif %}
{% if lt_social_image_url %}
<meta property="og:image" content="{{ lt_social_image_url }}">
<meta name="twitter:image" content="{{ lt_social_image_url }}">
{% endif %}
{% if lt_og_url %}
<meta property="og:url" content="{{ lt_og_url }}">
{% endif %}
{% if lt_site_name %}
<meta property="og:site_name" content="{{ lt_site_name }}">
{% endif %}
{% for item in structured_data or [] %}
<script type="application/ld+json">{{ item | json }}</script>
{% endfor %}
