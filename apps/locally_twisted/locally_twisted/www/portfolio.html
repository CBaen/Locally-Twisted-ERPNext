{% extends "templates/web.html" %}

{% block head_include %}
<link rel="stylesheet" href="/assets/locally_twisted/css/lt-portfolio-reel.css?v=20260506-1">
{% endblock %}

{% block page_content %}

<section class="lt-portfolio" data-portfolio aria-labelledby="lt-portfolio-title">
    <header class="lt-portfolio__intro">
        <p class="lt-portfolio__eyebrow">Selected work</p>
        <h1 id="lt-portfolio-title" class="lt-portfolio__title">{{ portfolio_heading }}</h1>
    </header>

    {% if portfolio_count %}
    <main class="lt-reel" data-reel aria-label="Portfolio photos"></main>

    <noscript>
        <div class="lt-portfolio__noscript" aria-label="Portfolio photos">
            {% for item in gallery_items %}
            <img src="{{ item.optimized_url }}"
                 alt="{{ item.alt }}"
                 width="{{ item.w }}"
                 height="{{ item.h }}"
                 loading="{{ 'eager' if loop.index <= 2 else 'lazy' }}"
                 decoding="async">
            {% endfor %}
        </div>
    </noscript>
    {% else %}
    <div class="lt-portfolio__empty" role="status">
        <h2>No portfolio photos match this view yet.</h2>
        <a href="/portfolio">View the full portfolio</a>
    </div>
    {% endif %}
</section>

<script>
window.LT_PORTFOLIO_PHOTOS = {{ portfolio_photos_json | safe }};
</script>
<script src="/assets/locally_twisted/js/lt-portfolio-reel.js?v=20260506-1"></script>
<script type="application/ld+json">
{{ itemlist_jsonld | safe }}
</script>

{% endblock %}
