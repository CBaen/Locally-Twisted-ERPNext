{% extends "templates/web.html" %}

{% block page_content %}

<style>
.lt-book__intro {
    background-color: var(--lt-blue-tint);
    padding: 3rem 1rem 2.5rem;
    text-align: center;
}
.lt-book__intro h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 2.25rem;
    color: var(--lt-near-black);
    margin: 0 0 0.5rem;
    line-height: 1.15;
}
.lt-book__intro-lede {
    font-size: 1.125rem;
    color: var(--lt-soft-gray);
    margin: 0;
    font-weight: 300;
}

.lt-book__info {
    background-color: var(--lt-blush-tint);
    padding: 2rem 1rem;
    margin-top: 1rem;
}
.lt-book__info-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem 2.5rem;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
    font-size: 1rem;
    color: var(--lt-near-black);
}
.lt-book__info-item {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}
.lt-book__info-item a {
    color: var(--lt-near-black);
    text-decoration: none;
    font-weight: 600;
}
.lt-book__info-item a:hover { text-decoration: underline; }
</style>

<section class="lt-book__intro">
    <div class="container">
        <h1>Tell us about your celebration</h1>
        <p class="lt-book__intro-lede">Share a few details and we take it from there.</p>
    </div>
</section>

{% include "templates/includes/book_form.html" %}

<section class="lt-book__info">
    <div class="lt-book__info-row">
        <div class="lt-book__info-item">
            <span aria-hidden="true">&#x21A9;</span>
            <span>We reach out within 24 hours</span>
        </div>
        <div class="lt-book__info-item">
            <span aria-hidden="true">&#x260E;</span>
            <a href="tel:+18012850860"><span class="o_force_ltr">(801) 285-0860</span></a>
        </div>
    </div>
</section>

{% endblock %}
