<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Moment — Locally Twisted Design Studio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #FBFBFB; }

    .upsell-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: #FFFFFF;
      overflow: hidden;
    }

    /* Nav */
    .upsell-nav {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid #EBEBEB;
    }

    .upsell-nav__back {
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: #595A5C;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .upsell-nav__title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      color: #1A1A1A;
      flex: 1;
    }

    /* Canvas: shows the arch + ghost column */
    .upsell-canvas {
      flex: 1;
      background: #F9F9F9;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      padding: 16px 20px 20px;
      position: relative;
      overflow: hidden;
    }

    .upsell-done-badge {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #FFFFFF;
      border: 1.5px solid #EBEBEB;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #595A5C;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Arch piece (fully colored) */
    .arch-piece {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .arch-piece__name {
      font-size: 0.6875rem;
      font-weight: 500;
      color: #595A5C;
      margin-top: 5px;
    }

    .arch-piece__checkmark {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #008080;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    /* Ghost column — the discovery target */
    /* Pre-tinted in the arch palette; style label inherits Design attribute */
    .ghost-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .ghost-column__shape {
      border: 2px dashed #7FA3C0;
      border-radius: 12px;
      width: 70px;
      height: 130px;
      position: relative;
      background: rgba(127,163,192,0.05);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .ghost-column:hover .ghost-column__shape {
      border-color: #008080;
      background: rgba(0,128,128,0.04);
    }

    /* Ghost column preview — SVG balloons, tinted via initGhostInheritance() */
    .ghost-column-preview {
      position: absolute;
      inset: 0;
      opacity: 0.45;
    }

    .ghost-column__label-area {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
    }

    .ghost-column__plus {
      font-size: 1.25rem;
      color: #7FA3C0;
      display: block;
      margin-bottom: 2px;
      line-height: 1;
    }

    .ghost-column__name {
      font-size: 0.5625rem;
      font-weight: 700;
      color: #595A5C;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .ghost-column__tap-label {
      font-size: 0.6875rem;
      font-weight: 600;
      color: #595A5C;
      margin-top: 6px;
      text-align: center;
    }

    /* Suggestion panel (slides up from bottom after arch completion) */
    .suggestion-panel {
      background: #FFFFFF;
      border-top: 1px solid #EBEBEB;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.07);
      animation: panelSlideUp 0.35s ease-out;
    }

    @keyframes panelSlideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .suggestion-handle {
      width: 36px;
      height: 4px;
      background: #D0D0D0;
      border-radius: 2px;
      margin: 10px auto 0;
    }

    .suggestion-header {
      padding: 10px 16px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .suggestion-header__title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      color: #1A1A1A;
    }

    .suggestion-header__dismiss {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: #595A5C;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      border-radius: 6px;
    }

    .suggestion-header__dismiss:hover { background: #F4DFD7; }

    .suggestion-body {
      padding: 10px 16px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .suggestion-preview-col {
      width: 68px;
      height: 90px;
      flex-shrink: 0;
      border-radius: 10px;
      border: 1.5px solid #EBEBEB;
      background: #F9F9F9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .suggestion-text { flex: 1; }

    .suggestion-subtitle {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #595A5C;
      margin-bottom: 4px;
    }

    /* Headline updated by initGhostInheritance() to include Design style */
    /* "A Column in your Swirl style — they pair beautifully" */
    .suggestion-desc {
      font-size: 0.875rem;
      color: #1A1A1A;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .suggestion-colors-note {
      font-size: 0.75rem;
      color: #595A5C;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    /* Palette dots populated by initGhostInheritance() with live colors */
    .suggestion-palette-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .suggestion-actions {
      display: flex;
      gap: 8px;
    }

    .suggestion-actions .btn-ghost   { font-size: 0.8125rem; padding: 10px 16px; }
    .suggestion-actions .btn-primary { font-size: 0.8125rem; padding: 10px 16px; flex: 1; }
  </style>
</head>
<body>
<div class="upsell-layout" id="upsell-screen">

  <!-- Nav -->
  <div class="upsell-nav">
    <button class="upsell-nav__back" onclick="window.location.href='02-color-one.html'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 12L6 8l4-4" stroke="#595A5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>
    <span class="upsell-nav__title">Balloon Arch</span>
  </div>

  <!-- Canvas: colored arch + ghost column -->
  <div class="upsell-canvas">
    <div class="upsell-done-badge">Arch looks great!</div>

    <!-- Arch — colored in Blush / Dusk Blue / White (actual LT catalog names) -->
    <div class="arch-piece">
      <svg viewBox="0 0 140 120" width="140" height="120" fill="none">
        <ellipse cx="18"  cy="90" rx="15" ry="18" fill="#F4C2C2" stroke="#1A1A1A" stroke-width="0.8"/>
        <ellipse cx="38"  cy="70" rx="14" ry="17" fill="#7FA3C0" stroke="#1A1A1A" stroke-width="0.8"/>
        <ellipse cx="70"  cy="42" rx="18" ry="20" fill="#F4C2C2" stroke="#1A1A1A" stroke-width="0.8"/>
        <ellipse cx="102" cy="70" rx="14" ry="17" fill="#7FA3C0" stroke="#1A1A1A" stroke-width="0.8"/>
        <ellipse cx="122" cy="90" rx="15" ry="18" fill="#F4C2C2" stroke="#1A1A1A" stroke-width="0.8"/>
        <ellipse cx="52"  cy="56" rx="10" ry="13" fill="#FFFFFF"  stroke="#BDBDBD" stroke-width="0.7"/>
        <ellipse cx="88"  cy="56" rx="10" ry="13" fill="#FFFFFF"  stroke="#BDBDBD" stroke-width="0.7"/>
        <line x1="18"  y1="108" x2="18"  y2="120" stroke="#1A1A1A" stroke-width="0.8"/>
        <line x1="122" y1="108" x2="122" y2="120" stroke="#1A1A1A" stroke-width="0.8"/>
      </svg>
      <div class="arch-piece__name">Arch · Swirl</div>
      <div class="arch-piece__checkmark">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
          <path d="M1 4l3 3L9 1" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Ghost column — pre-tinted in arch palette, Design style inherited -->
    <!-- initGhostInheritance() re-fills [data-ghost-balloon] elements + updates label -->
    <div class="ghost-column" id="ghost-column-target"
         onclick="window.location.href='02-color-one.html'"
         title="Add a matching column">
      <div class="ghost-column__shape">
        <!-- SVG column preview: balloons tagged data-ghost-balloon for palette injection -->
        <svg class="ghost-column-preview" viewBox="0 0 70 130" width="70" height="130" fill="none">
          <!-- Swirl pattern: alternating Blush / Dusk Blue — initGhostInheritance() re-tints these -->
          <ellipse cx="35" cy="17"  rx="17" ry="16" data-ghost-balloon="true" fill="#F4C2C2"/>
          <ellipse cx="35" cy="45"  rx="16" ry="15" data-ghost-balloon="true" fill="#7FA3C0"/>
          <ellipse cx="35" cy="72"  rx="17" ry="16" data-ghost-balloon="true" fill="#F4C2C2"/>
          <ellipse cx="35" cy="99"  rx="16" ry="15" data-ghost-balloon="true" fill="#7FA3C0"/>
          <ellipse cx="35" cy="122" rx="13" ry="12" data-ghost-balloon="true" fill="#FFFFFF"/>
        </svg>
        <div class="ghost-column__label-area">
          <span class="ghost-column__plus">+</span>
          <div class="ghost-column__name">Column</div>
        </div>
      </div>
      <div class="ghost-column__tap-label">+ Add column</div>
    </div>

  </div><!-- /upsell-canvas -->

  <!-- Suggestion panel — appears after arch completion -->
  <!-- initGhostInheritance() updates .suggestion-panel__headline and .suggestion-palette-dots -->
  <div class="suggestion-panel">
    <div class="suggestion-handle"></div>

    <div class="suggestion-header">
      <div class="suggestion-header__title">Complete the look</div>
      <button class="suggestion-header__dismiss" title="Dismiss">&#215;</button>
    </div>

    <div class="suggestion-body">

      <!-- Column preview — SVG balloons use same LT catalog palette -->
      <div class="suggestion-preview-col">
        <svg viewBox="0 0 52 80" width="52" height="80" fill="none">
          <ellipse cx="26" cy="11" rx="13" ry="12" fill="#F4C2C2" stroke="#1A1A1A" stroke-width="0.7"/>
          <ellipse cx="26" cy="31" rx="12" ry="12" fill="#7FA3C0" stroke="#1A1A1A" stroke-width="0.7"/>
          <ellipse cx="26" cy="50" rx="13" ry="12" fill="#F4C2C2" stroke="#1A1A1A" stroke-width="0.7"/>
          <ellipse cx="26" cy="68" rx="12" ry="11" fill="#7FA3C0" stroke="#1A1A1A" stroke-width="0.7"/>
        </svg>
      </div>

      <div class="suggestion-text">
        <div class="suggestion-subtitle">Suggested next</div>

        <!-- Headline: updated by initGhostInheritance() to include Design style -->
        <!-- Default: "A Column in your Swirl style — they pair beautifully" -->
        <div class="suggestion-desc suggestion-panel__headline">
          A Column in your Swirl style — they pair beautifully
        </div>

        <!-- Palette dots: populated by initGhostInheritance() with live colors + names -->
        <div class="suggestion-colors-note">
          <div class="suggestion-palette-dots">
            <!-- Static fallback — script replaces with live palette dots -->
            <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#F4C2C2; border:2px solid rgba(255,255,255,0.6); margin-right:4px; box-shadow:0 1px 3px rgba(0,0,0,.15);" title="Blush"></span>
            <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#7FA3C0; border:2px solid rgba(255,255,255,0.6); margin-right:4px; box-shadow:0 1px 3px rgba(0,0,0,.15);" title="Dusk Blue"></span>
            <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#FFFFFF; border:2px solid #EBEBEB; margin-right:4px; box-shadow:0 1px 3px rgba(0,0,0,.15);" title="White"></span>
          </div>
          <span>Pre-filled with your colors</span>
        </div>

        <div class="suggestion-actions">
          <button class="btn-ghost" onclick="window.location.href='04-composition.html'">Skip</button>
          <button class="btn-primary" id="add-suggested-piece"
                  onclick="window.location.href='02-color-one.html'">Add a column</button>
        </div>
      </div>

    </div><!-- /suggestion-body -->
  </div><!-- /suggestion-panel -->

</div><!-- /upsell-layout -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
<script>
$(document).ready(function() {

  // Ghost inherits Design style + palette from preceding arch
  // Updates headline to "A Column in your Swirl style — they pair beautifully"
  // Re-tints [data-ghost-balloon] SVG elements with live composition colors
  initGhostInheritance();

  // Dismiss handler
  $('.suggestion-header__dismiss').on('click', function() {
    $('.suggestion-panel').slideUp(200);
  });

  // Ghost column pulse to draw attention (stops on hover)
  var pulsing = true;
  function pulseGhost() {
    if (!pulsing) return;
    $('#ghost-column-target').animate({ opacity: 0.55 }, 700, function() {
      $(this).animate({ opacity: 1 }, 700, pulseGhost);
    });
  }
  setTimeout(pulseGhost, 1600);

  $('#ghost-column-target').on('mouseenter', function() {
    pulsing = false;
    $(this).stop(true, true).css('opacity', 1);
  });

});
</script>
</body>
</html>
