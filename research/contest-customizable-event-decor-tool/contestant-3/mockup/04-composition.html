<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Design — Design Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <a href="01-entry.html" class="nav-back">← Add piece</a>
  <a href="#" class="logo" style="text-align:right;">My Design<span>2 pieces added</span></a>
</header>

<!-- COMPOSITION SCREEN -->
<div class="composition-screen">

  <!-- Composition header: title + palette preview dots -->
  <div class="composition-header">
    <h2>Your event look</h2>
    <div class="composition-palette-preview">
      <div class="dot" style="background:#A8E6CF;"></div>
      <div class="dot" style="background:#F4DFD7;"></div>
      <div class="dot" style="background:#BFFF5C;"></div>
    </div>
  </div>

  <!-- Book spread -->
  <div class="composition-book">

    <!-- Accent band: thin color stripe = "design book" header -->
    <div class="composition-accent-band"
         style="background:linear-gradient(to right, #A8E6CF, #F4DFD7, #BFFF5C);"></div>

    <!-- Composition pieces grid -->
    <div class="pieces-grid">

      <!-- Piece 1: Arch (colored) -->
      <div class="piece-card" onclick="window.location.href='02-color-one.html'">
        <div class="piece-thumb">
          <svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 Q10 20 60 20 Q110 20 110 90" stroke="#ccc" stroke-width="1.5" fill="none"/>
            <!-- Main balloons (seafoam) -->
            <circle cx="18" cy="72" r="12" fill="#A8E6CF" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <circle cx="14" cy="54" r="11" fill="#A8E6CF" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <!-- Accent (blush) -->
            <circle cx="23" cy="38" r="11" fill="#F4DFD7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <circle cx="36" cy="28" r="10" fill="#F4DFD7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <!-- Pop (lime) -->
            <circle cx="52" cy="24" r="11" fill="#BFFF5C" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <circle cx="60" cy="22" r="11" fill="#BFFF5C" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <circle cx="68" cy="24" r="11" fill="#BFFF5C" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <!-- Accent right mirror (blush) -->
            <circle cx="84" cy="28" r="10" fill="#F4DFD7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <circle cx="97" cy="38" r="11" fill="#F4DFD7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <!-- Main right mirror (seafoam) -->
            <circle cx="106" cy="54" r="11" fill="#A8E6CF" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <circle cx="102" cy="72" r="12" fill="#A8E6CF" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <!-- Base stubs -->
            <rect x="6" y="88" width="18" height="6" rx="2" fill="#E8E8E8"/>
            <rect x="96" y="88" width="18" height="6" rx="2" fill="#E8E8E8"/>
          </svg>
        </div>
        <div class="piece-meta">
          <span class="piece-name">Balloon Arch</span>
          <div class="piece-colors">
            <span class="piece-color-dot" style="background:#A8E6CF;"></span>
            <span class="piece-color-dot" style="background:#F4DFD7;"></span>
            <span class="piece-color-dot" style="background:#BFFF5C;"></span>
          </div>
        </div>
      </div>

      <!-- Piece 2: Column (colored) -->
      <div class="piece-card" onclick="window.location.href='02-color-one.html'">
        <div class="piece-thumb">
          <svg viewBox="0 0 80 100" fill="none">
            <!-- Column body: main color seafoam -->
            <rect x="24" y="28" width="32" height="60" rx="8"
                  fill="#A8E6CF" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <!-- Accent accent top: blush -->
            <ellipse cx="40" cy="28" rx="16" ry="8"
                     fill="#F4DFD7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
            <!-- Pop top accent cap: lime -->
            <ellipse cx="40" cy="22" rx="12" ry="6"
                     fill="#BFFF5C" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <!-- Base -->
            <rect x="18" y="88" width="44" height="8" rx="4"
                  fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>
          </svg>
        </div>
        <div class="piece-meta">
          <span class="piece-name">Column</span>
          <div class="piece-colors">
            <span class="piece-color-dot" style="background:#A8E6CF;"></span>
            <span class="piece-color-dot" style="background:#F4DFD7;"></span>
            <span class="piece-color-dot" style="background:#BFFF5C;"></span>
          </div>
        </div>
      </div>

      <!-- Empty slot 1: Centerpiece (Zeigarnik Effect — invitation, not obligation) -->
      <!-- The silhouette is a door, not a checklist item. Copy signals optional. -->
      <div class="piece-card empty-piece" onclick="window.location.href='06-upsell.html'">
        <div class="piece-thumb">
          <svg class="empty-silhouette" viewBox="0 0 80 100" fill="none">
            <rect x="24" y="76" width="32" height="8" rx="3" fill="#595A5C"/>
            <line x1="40" y1="76" x2="40" y2="52" stroke="#595A5C" stroke-width="2"/>
            <circle cx="40" cy="42" r="14" fill="#595A5C"/>
            <circle cx="27" cy="50" r="9" fill="#595A5C" opacity="0.7"/>
            <circle cx="53" cy="50" r="9" fill="#595A5C" opacity="0.7"/>
          </svg>
        </div>
        <div class="piece-meta">
          <span class="piece-name" style="color:#9E9E9E;font-weight:400;">Want a centerpiece too?</span>
        </div>
      </div>

      <!-- Empty slot 2: Garland -->
      <div class="piece-card empty-piece" onclick="window.location.href='01-entry.html'">
        <div class="piece-thumb">
          <svg class="empty-silhouette" viewBox="0 0 80 60" fill="none">
            <circle cx="14" cy="32" r="9" fill="#595A5C"/>
            <circle cx="30" cy="24" r="9" fill="#595A5C"/>
            <circle cx="46" cy="32" r="9" fill="#595A5C" opacity="0.7"/>
            <circle cx="62" cy="24" r="9" fill="#595A5C" opacity="0.5"/>
          </svg>
        </div>
        <div class="piece-meta">
          <span class="piece-name" style="color:#9E9E9E;font-weight:400;">Or a garland?</span>
        </div>
      </div>

    </div><!-- /.pieces-grid -->

    <!-- Palette summary -->
    <div style="margin-top:24px;padding:16px;background:#fff;border-radius:12px;border:1px solid #E8E8E8;">
      <div style="font-family:'DM Serif Display',serif;font-size:0.95rem;color:#1A1A1A;margin-bottom:12px;">Your color palette</div>
      <!-- Color names are catalog SKUs — Jeff orders by name, not hex. Hex values are approximate. -->
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
        <div style="width:32px;height:32px;border-radius:50%;background:#A8E6CF;border:1.5px solid rgba(0,0,0,0.08);flex-shrink:0;"></div>
        <div>
          <div style="font-family:'Raleway',sans-serif;font-size:0.85rem;font-weight:600;color:#1A1A1A;">Empowermint</div>
          <div style="font-family:'Raleway',sans-serif;font-size:0.72rem;color:#595A5C;">~#A8E6CF — Main</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
        <div style="width:32px;height:32px;border-radius:50%;background:#F4DFD7;border:1.5px solid rgba(0,0,0,0.08);flex-shrink:0;"></div>
        <div>
          <div style="font-family:'Raleway',sans-serif;font-size:0.85rem;font-weight:600;color:#1A1A1A;">Blush</div>
          <div style="font-family:'Raleway',sans-serif;font-size:0.72rem;color:#595A5C;">~#F4DFD7 — Accent</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div style="width:32px;height:32px;border-radius:50%;background:#BFFF5C;border:1.5px solid rgba(0,0,0,0.08);flex-shrink:0;"></div>
        <div>
          <div style="font-family:'Raleway',sans-serif;font-size:0.85rem;font-weight:600;color:#1A1A1A;">Lime</div>
          <div style="font-family:'Raleway',sans-serif;font-size:0.72rem;color:#595A5C;">~#BFFF5C — Pop</div>
        </div>
      </div>
    </div>

  </div><!-- /.composition-book -->

  <!-- Composition actions -->
  <!-- Primary: this design is complete right now — send it. The parent who has one piece is done. -->
  <!-- Secondary: add more if you want. Not required. -->
  <div class="composition-actions">
    <a href="05-done.html" class="btn btn-primary" style="flex:2;">
      This looks good → Send to Jeff
    </a>
    <a href="01-entry.html" class="btn btn-secondary" style="font-size:0.85rem;">
      + Add piece
    </a>
  </div>

</div><!-- /.composition-screen -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
