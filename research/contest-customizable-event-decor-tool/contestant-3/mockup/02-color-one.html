<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Your Arch — Design Studio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Page-scoped: coloring screen layout */
    body { overflow: hidden; }
    @media (max-width: 767px) {
      body { overflow: auto; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <a href="01-entry.html" class="nav-back">← Shapes</a>
  <a href="#" class="logo" style="text-align:right;">Balloon Arch<span>tap regions · pick colors</span></a>
</header>

<!-- COLORING SCREEN WRAPPER -->
<div class="color-screen">

  <!-- SHAPE STAGE -->
  <div class="shape-stage">
    <!-- Region key (tap to activate that region) -->
    <div class="region-key" style="position:absolute;top:12px;left:16px;">
      <div class="region-key-item active" data-region="arch-main">
        <span class="region-key-dot" id="key-arch-main"></span>
        <span style="font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;">Main</span>
      </div>
      <div class="region-key-item" data-region="arch-accent">
        <span class="region-key-dot" id="key-arch-accent"></span>
        <span style="font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;">Accent</span>
      </div>
      <div class="region-key-item" data-region="arch-secondary">
        <span class="region-key-dot" id="key-arch-secondary"></span>
        <span style="font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;">Pop</span>
      </div>
    </div>

    <!-- The Arch SVG illustration — inline, fill regions have IDs -->
    <div class="shape-illustration">
      <svg viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Balloon arch with colored fill regions"
           style="width:100%;max-width:320px;">

        <!-- Guide arch path (structure only, no fill) -->
        <path d="M30 200 Q30 40 140 40 Q250 40 250 200"
              stroke="#E0E0E0" stroke-width="2" fill="none"/>

        <!-- BOTTOM LEFT cluster — main region -->
        <circle id="arch-main" class="fill-region" data-label="Main"
                cx="48" cy="162" r="24"/>
        <circle id="arch-main-2" class="fill-region" data-label="Main"
                cx="38" cy="128" r="22"/>

        <!-- LOWER MID LEFT — accent region -->
        <circle id="arch-accent" class="fill-region" data-label="Accent"
                cx="56" cy="98" r="22"/>
        <circle id="arch-accent-2" class="fill-region" data-label="Accent"
                cx="78" cy="72" r="21"/>

        <!-- TOP CENTER — secondary/pop region -->
        <circle id="arch-secondary" class="fill-region" data-label="Pop"
                cx="108" cy="55" r="22"/>
        <circle id="arch-secondary-2" class="fill-region" data-label="Pop"
                cx="140" cy="48" r="23"/>
        <circle id="arch-secondary-3" class="fill-region" data-label="Pop"
                cx="172" cy="55" r="22"/>

        <!-- LOWER MID RIGHT — accent mirrors -->
        <circle class="fill-region fill-mirror" data-label="Accent" data-mirrors="arch-accent"
                cx="202" cy="72" r="21"/>
        <circle class="fill-region fill-mirror" data-label="Accent" data-mirrors="arch-accent"
                cx="224" cy="98" r="22"/>

        <!-- BOTTOM RIGHT cluster — main mirrors -->
        <circle class="fill-region fill-mirror" data-label="Main" data-mirrors="arch-main"
                cx="242" cy="128" r="22"/>
        <circle class="fill-region fill-mirror" data-label="Main" data-mirrors="arch-main"
                cx="232" cy="162" r="24"/>

        <!-- Base/column stubs -->
        <rect x="20" y="195" width="36" height="12" rx="4"
              fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>
        <rect x="224" y="195" width="36" height="12" rx="4"
              fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>

      </svg>
    </div>

    <!-- Instruction hint (fades after first tap) -->
    <div id="tap-hint" style="
      position:absolute; bottom:12px; left:0; right:0;
      text-align:center;
      font-family:'Raleway',sans-serif; font-size:0.75rem;
      font-weight:500; color:#595A5C;
      animation: fadeHint 3s ease 2s forwards;
    ">
      ↓ Tap a balloon to color it
    </div>
    <style>
      @keyframes fadeHint { to { opacity: 0; } }
    </style>
  </div><!-- /.shape-stage -->

  <!-- PALETTE TRAY -->
  <div class="palette-tray">
    <!-- Tray header: which region is active + hex code -->
    <div class="palette-tray-header">
      <span class="tray-region-name">Color: Main</span>
      <span class="hex-pill">#F2F2F2</span>
    </div>

    <!-- Open full picker link -->
    <div style="margin-bottom:12px;">
      <a href="03-picker.html" style="font-family:'Raleway',sans-serif;font-size:0.78rem;font-weight:500;color:#595A5C;text-decoration:underline;">
        Browse all 50+ colors →
      </a>
    </div>

    <!-- Hot swatches: 8-wide compact grid -->
    <div id="palette-hot" class="palette-hot"></div>

    <!-- Family rows -->
    <div id="palette-families" class="palette-families" style="margin-top:12px;"></div>

    <!-- Primary and early-exit CTAs -->
    <!-- Primary: send this single piece directly to Jeff — visible at once, no multi-piece commitment needed -->
    <!-- Secondary: add to a multi-piece composition for the explorer parent -->
    <div style="margin-top:auto;padding-top:16px;">
      <a href="05-done.html" class="btn btn-primary btn-block" style="margin-bottom:8px;">
        Send this to Jeff →
      </a>
      <button id="btn-add-composition" class="btn btn-secondary btn-block" style="font-size:0.85rem;">
        Add to a multi-piece design
      </button>
    </div>

  </div><!-- /.palette-tray -->

</div><!-- /.color-screen -->

<script>
  // Hide tap hint after first interaction
  document.querySelector('.shape-stage').addEventListener('click', function() {
    var hint = document.getElementById('tap-hint');
    if (hint) hint.style.opacity = '0';
  }, { once: true });

  // Mirror-region fill: when a mirrored region is clicked,
  // delegate to the primary region's fill
  document.querySelectorAll('[onclick]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      // The onclick attr handles delegation
    });
  });
</script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
<script>
  // After jQuery loads, init the first region as selected
  $(function() {
    // Select "Main" region on load
    setTimeout(function() {
      selectRegionOnLoad('arch-main');
    }, 100);

    function selectRegionOnLoad(regionId) {
      var $region = $('#' + regionId);
      if ($region.length) {
        $region.addClass('selected-region');
        $('[data-region="' + regionId + '"]').addClass('active');
      }
    }
  });
</script>
</body>
</html>
