<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Design — Design Studio | Locally Twisted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Desktop: wider cards in a wrapping grid */
    @media (min-width: 768px) {
      .lt-page {
        max-width: 100%;
      }
      .composition-scroll-wrap {
        flex-wrap: wrap;
        overflow-x: visible;
        padding: 20px 32px 32px;
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .piece-card {
        width: 260px;
      }
      .add-piece-card {
        width: 200px;
        min-height: 320px;
      }
    }

    /* Scroll indicator dots (mobile) */
    .scroll-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 8px 0 4px;
    }
    .scroll-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #D0D0D0;
      transition: background 0.2s;
    }
    .scroll-dot.active {
      background: #1A1A1A;
      width: 18px;
      border-radius: 3px;
    }
    @media (min-width: 768px) {
      .scroll-dots { display: none; }
    }

    /* Drag hint */
    .drag-hint {
      text-align: center;
      font-size: 12px;
      color: #C0C0C0;
      padding: 4px 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    @media (min-width: 768px) {
      .drag-hint { display: none; }
    }
  </style>
</head>
<body data-page="composition">

  <div class="lt-page">

    <!-- Header -->
    <header class="lt-header">
      <a href="01-entry.html" class="lt-header__back">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        Shapes
      </a>
      <span class="lt-header__title">My Design</span>
      <a href="05-done.html" style="font-size:13px; font-weight:600; color:#008080; text-decoration:none; white-space:nowrap;">
        Done →
      </a>
    </header>

    <!-- Composition header with piece count -->
    <div class="composition-header">
      <h2 style="font-size:16px; font-family:'DM Serif Display',serif; font-weight:400; color:#1A1A1A;">
        Your Pieces
      </h2>
      <span class="composition-header__count">3 pieces</span>
    </div>

    <!-- Drag hint (mobile) -->
    <div class="drag-hint">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 7h10M8 4l3 3-3 3"/>
      </svg>
      Scroll to see all pieces
    </div>

    <!-- Horizontal composition scroll -->
    <div class="composition-scroll-wrap">

      <!-- Piece 1: Arch — Teal + Gold -->
      <div class="piece-card" data-piece-id="piece-arch">

              <circle cx="17"  cy="73" r="10" fill="#008080"/>
              <circle cx="28"  cy="52" r="10" fill="#008080"/>
              <circle cx="46"  cy="32" r="11" fill="#008080"/>
              <circle cx="80"  cy="20" r="12" fill="#008080"/>
              <circle cx="114" cy="32" r="11" fill="#008080"/>
              <circle cx="132" cy="52" r="10" fill="#008080"/>
              <circle cx="143" cy="73" r="10" fill="#008080"/>
              <circle cx="142" cy="95" r="11" fill="#008080"/>
            </g>
            <g><!-- Gold accent balloons -->
              <circle cx="17"  cy="84" r="8"  fill="#D4A017"/>
              <circle cx="22"  cy="62" r="8"  fill="#D4A017"/>
              <circle cx="36"  cy="42" r="9"  fill="#D4A017"/>
              <circle cx="62"  cy="24" r="9"  fill="#D4A017"/>
              <circle cx="98"  cy="24" r="9"  fill="#D4A017"/>
              <circle cx="124" cy="42" r="9"  fill="#D4A017"/>
              <circle cx="138" cy="62" r="8"  fill="#D4A017"/>
              <circle cx="143" cy="84" r="8"  fill="#D4A017"/>
            </g>
            <line x1="18" y1="106" x2="18" y2="120" stroke="#C8C8C8" stroke-width="3"/>
            <line x1="142" y1="106" x2="142" y2="120" stroke="#C8C8C8" stroke-width="3"/>

        </div>
        <div class="piece-card__footer">
          <span class="piece-card__name">Balloon Arch</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="display:flex; gap:4px;">
              <div class="piece-card__color-dot" style="background:#008080;"></div>
              <div class="piece-card__color-dot" style="background:#D4A017;"></div>
            </div>
            <a href="02-color-one.html" style="background:none; border:none; cursor:pointer; color:#B0B0B0; padding:4px; display:flex; align-items:center; text-decoration:none;">

              </svg>
            </a>
          </div>
        </div>
      </div>

      <!-- Piece 2: Column — Teal + Gold (matching arch) -->
      <div class="piece-card" data-piece-id="piece-column">
        <div class="piece-card__illustration">

            <circle cx="40" cy="110" r="14" fill="#008080"/>
            <circle cx="40" cy="85"  r="14" fill="#D4A017"/>
            <circle cx="40" cy="60"  r="14" fill="#008080"/>
            <circle cx="40" cy="35"  r="14" fill="#D4A017"/>
            <circle cx="40" cy="14"  r="11" fill="#008080"/>
            <line x1="40" y1="124" x2="40" y2="130" stroke="#C8C8C8" stroke-width="4"/>
            <circle cx="40" cy="130" r="4" fill="#C8C8C8"/>
          </svg>
        </div>
        <div class="piece-card__footer">
          <span class="piece-card__name">Column</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="display:flex; gap:4px;">
              <div class="piece-card__color-dot" style="background:#008080;"></div>
              <div class="piece-card__color-dot" style="background:#D4A017;"></div>
            </div>
            <a href="02-color-one.html?shape=column" style="background:none; border:none; cursor:pointer; color:#B0B0B0; padding:4px; display:flex; align-items:center; text-decoration:none;">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9.5 2.5l2 2-6 6H3.5v-2l6-6z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>

      <!-- Piece 3: Garland — Blush + Dusk Blue (different scheme) -->
      <div class="piece-card" data-piece-id="piece-garland">
        <div class="piece-card__illustration">

            <path d="M 10 30 Q 40 60 80 50 Q 120 40 150 30" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4 3"/>

            <circle cx="30"  cy="48" r="10" fill="#8CA8C0"/>
            <circle cx="50"  cy="54" r="11" fill="#F4DFD7"/>

            <circle cx="90"  cy="48" r="11" fill="#F4DFD7"/>
            <circle cx="110" cy="42" r="10" fill="#8CA8C0"/>
            <circle cx="130" cy="34" r="11" fill="#F4DFD7"/>
            <circle cx="150" cy="30" r="10" fill="#8CA8C0"/>
          </svg>
        </div>
        <div class="piece-card__footer">
          <span class="piece-card__name">Garland</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="display:flex; gap:4px;">
              <div class="piece-card__color-dot" style="background:#F4DFD7;"></div>
              <div class="piece-card__color-dot" style="background:#8CA8C0;"></div>
            </div>
            <a href="02-color-one.html?shape=garland" style="background:none; border:none; cursor:pointer; color:#B0B0B0; padding:4px; display:flex; align-items:center; text-decoration:none;">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9.5 2.5l2 2-6 6H3.5v-2l6-6z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>

      <!-- Add a Piece card — with upsell suggestion -->
      <a href="06-upsell.html" class="add-piece-card">
        <div class="add-piece-card__icon">+</div>
        <span class="add-piece-card__label">Add a Piece</span>
        <span class="add-piece-card__hint">
          Garland · Backdrop<br>Drop · Bouquet
        </span>
        <div class="upsell-suggestion">
          Garlands pair beautifully with an arch — add one to your design?
        </div>
      </a>

    </div><!-- /composition-scroll -->

    <!-- Scroll indicator dots (mobile) -->
    <div class="scroll-dots">
      <div class="scroll-dot active"></div>
      <div class="scroll-dot"></div>
      <div class="scroll-dot"></div>
      <div class="scroll-dot"></div>
    </div>

    <!-- Bottom bar: color summary + CTA -->
    <div style="padding: 16px 20px 32px; border-top: 1px solid #E8E8E8; margin-top: 8px;">
      <!-- Color palette summary -->
      <div style="margin-bottom: 16px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #B0B0B0; margin-bottom: 8px;">
          Colors in This Design
        </div>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <div style="display:flex; align-items:center; gap:6px;">
            <div style="width:20px; height:20px; border-radius:50%; background:#008080; border:1.5px solid rgba(0,0,0,0.08);"></div>
            <span style="font-size:12px; color:#595A5C;">Teal</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <div style="width:20px; height:20px; border-radius:50%; background:#D4A017; border:1.5px solid rgba(0,0,0,0.08);"></div>
            <span style="font-size:12px; color:#595A5C;">Gold</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <div style="width:20px; height:20px; border-radius:50%; background:#F4DFD7; border:1.5px solid rgba(0,0,0,0.08);"></div>
            <span style="font-size:12px; color:#595A5C;">Blush</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <div style="width:20px; height:20px; border-radius:50%; background:#8CA8C0; border:1.5px solid rgba(0,0,0,0.08);"></div>
            <span style="font-size:12px; color:#595A5C;">Dusk Blue</span>
          </div>
        </div>
      </div>

      <a href="05-done.html" class="btn btn--primary btn--full">
        I'm Done — Let's Talk
      </a>
      <div style="text-align:center; margin-top:10px;">
        <a href="01-entry.html" class="btn btn--text">Keep designing</a>
      </div>
    </div>

  </div><!-- /lt-page -->

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
  <script>
    $(document).ready(function() {
      // Update scroll dot indicator on mobile
      var $wrap = $('.composition-scroll-wrap');
      var $dots = $('.scroll-dot');
      var totalCards = 4; // 3 pieces + add card

      $wrap.on('scroll', function() {
        var scrollLeft = $(this).scrollLeft();
        var cardWidth = 220 + 16; // card width + gap
        var activeIndex = Math.round(scrollLeft / cardWidth);
        $dots.removeClass('active');
        $dots.eq(activeIndex).addClass('active');
      });
    });
  </script>
</body>
</html>
