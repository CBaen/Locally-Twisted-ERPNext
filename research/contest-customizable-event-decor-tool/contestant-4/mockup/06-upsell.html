<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add More Pieces — Design Studio | Locally Twisted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    @media (min-width: 768px) {
      .lt-page { max-width: 680px; margin: 0 auto; }
      .suggestion-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }
    }
  </style>
</head>
<body data-page="upsell">

  <div class="lt-page upsell-screen">

    <!-- Header -->
    <header class="lt-header">
      <a href="04-composition.html" class="lt-header__back">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        My Design
      </a>
      <span class="lt-header__title">Add a Piece</span>
      <a href="04-composition.html" style="font-size:13px; font-weight:600; color:#595A5C; text-decoration:none;">
        Skip
      </a>
    </header>

    <!-- Trigger: what was just completed -->
    <div class="upsell-trigger-card">
      <div class="upsell-trigger-card__header">
        <div class="upsell-trigger-card__check">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#008080" stroke-width="2" stroke-linecap="round">
            <path d="M3 8l3.5 3.5L13 4"/>
          </svg>
        </div>
        <div class="upsell-trigger-card__title">Column colored</div>
      </div>
      <div class="upsell-trigger-card__body">
        <div class="upsell-trigger-card__piece-preview">
          <!-- Colored column: Teal + Gold -->
          <svg viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg" width="56" height="98">
            <circle cx="20" cy="58" r="8" fill="#008080"/>
            <circle cx="20" cy="44" r="8" fill="#D4A017"/>
            <circle cx="20" cy="30" r="8" fill="#008080"/>
            <circle cx="20" cy="16" r="8" fill="#D4A017"/>
            <circle cx="20" cy="5"  r="6" fill="#008080"/>
            <line x1="20" y1="65" x2="20" y2="70" stroke="#CCC" stroke-width="2"/>
          </svg>
        </div>
        <div class="upsell-trigger-card__piece-info">
          <div class="upsell-trigger-card__piece-name">Your Column</div>
          <div class="upsell-trigger-card__piece-colors">
            <div style="width:14px; height:14px; border-radius:50%; background:#008080; border:1.5px solid rgba(0,0,0,0.1);"></div>
            <div style="width:14px; height:14px; border-radius:50%; background:#D4A017; border:1.5px solid rgba(0,0,0,0.1); margin-left:4px;"></div>
            <span style="font-size:12px; color:#999; margin-left:6px;">Teal + Gold</span>
          </div>
        </div>
      </div>
    </div><!-- /trigger card -->

    <!-- Suggestion area -->
    <div class="upsell-suggestions" style="padding: 0 20px 16px; margin-top: 20px;">
      <div class="upsell-suggestions__label" style="padding-top: 0;">What goes with this?</div>

      <!-- Featured suggestion: arch (highest visual impact pairing) -->
      <div style="margin-bottom: 16px; padding: 16px; background: #F0FAF9; border-radius: 12px; border: 1.5px solid #D0EDED;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #008080; margin-bottom: 10px;">
          Columns look great flanking an arch ↓
        </div>
        <!-- Visual pairing: column + ghost arch + column -->
        <div style="display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-bottom: 12px;">

          <!-- Left column (completed) -->
          <svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg" width="36" height="72">
            <circle cx="20" cy="68" r="8" fill="#008080"/>
            <circle cx="20" cy="52" r="8" fill="#D4A017"/>
            <circle cx="20" cy="36" r="8" fill="#008080"/>
            <circle cx="20" cy="20" r="8" fill="#D4A017"/>
            <circle cx="20" cy="7"  r="6" fill="#008080"/>
            <line x1="20" y1="75" x2="20" y2="80" stroke="#CCC" stroke-width="2"/>
          </svg>

          <!-- Ghost arch (to be filled) -->
          <svg viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg" width="140" height="88">
            <g opacity="0.25">
              <circle cx="18"  cy="78" r="11" fill="#008080"/>
              <circle cx="17"  cy="58" r="10" fill="#008080"/>
              <circle cx="28"  cy="40" r="10" fill="#008080"/>
              <circle cx="46"  cy="24" r="11" fill="#008080"/>
              <circle cx="80"  cy="14" r="12" fill="#008080"/>
              <circle cx="114" cy="24" r="11" fill="#008080"/>
              <circle cx="132" cy="40" r="10" fill="#008080"/>
              <circle cx="143" cy="58" r="10" fill="#008080"/>
              <circle cx="142" cy="78" r="11" fill="#008080"/>
              <circle cx="17"  cy="68" r="8"  fill="#D4A017"/>
              <circle cx="22"  cy="49" r="8"  fill="#D4A017"/>
              <circle cx="36"  cy="32" r="9"  fill="#D4A017"/>
              <circle cx="62"  cy="18" r="9"  fill="#D4A017"/>
              <circle cx="98"  cy="18" r="9"  fill="#D4A017"/>
              <circle cx="124" cy="32" r="9"  fill="#D4A017"/>
              <circle cx="138" cy="49" r="8"  fill="#D4A017"/>
              <circle cx="143" cy="68" r="8"  fill="#D4A017"/>
            </g>
            <!-- "Tap to add" label centered -->
            <text x="80" y="55" text-anchor="middle" font-family="Raleway,sans-serif" font-size="11" fill="#008080" font-weight="600">Tap to add →</text>
            <line x1="18" y1="88" x2="18" y2="100" stroke="#DDD" stroke-width="3"/>
            <line x1="142" y1="88" x2="142" y2="100" stroke="#DDD" stroke-width="3"/>
          </svg>

          <!-- Right column (completed) -->
          <svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg" width="36" height="72">
            <circle cx="20" cy="68" r="8" fill="#008080"/>
            <circle cx="20" cy="52" r="8" fill="#D4A017"/>
            <circle cx="20" cy="36" r="8" fill="#008080"/>
            <circle cx="20" cy="20" r="8" fill="#D4A017"/>
            <circle cx="20" cy="7"  r="6" fill="#008080"/>
            <line x1="20" y1="75" x2="20" y2="80" stroke="#CCC" stroke-width="2"/>
          </svg>

        </div>

        <a href="02-color-one.html" class="btn btn--primary btn--full">
          Add a Matching Arch
        </a>
      </div>

      <!-- Other suggestions row -->
      <div class="upsell-suggestions__label" style="margin-top: 16px;">Or add something else</div>
      <div class="suggestion-row">

        <!-- Garland suggestion (ghosted with color hint) -->
        <a href="02-color-one.html?shape=garland" class="suggestion-card highlighted">
          <div class="suggestion-card__illustration">
            <!-- Garland with same colors pre-suggested -->
            <svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 14 Q 25 38 50 26 Q 75 14 95 38" fill="none" stroke="#B8FF9E" stroke-width="3" stroke-dasharray="4 3"/>
              <circle cx="5"  cy="14" r="9"  fill="#008080"/>
              <circle cx="22" cy="32" r="8"  fill="#D4A017"/>
              <circle cx="40" cy="20" r="9"  fill="#008080"/>
              <circle cx="60" cy="18" r="8"  fill="#D4A017"/>
              <circle cx="78" cy="26" r="9"  fill="#008080"/>
              <circle cx="95" cy="38" r="8"  fill="#D4A017"/>
            </svg>
          </div>
          <div class="suggestion-card__body">
            <div class="suggestion-card__name">Garland</div>
            <div class="suggestion-card__match">
              <svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:middle; margin-right:3px;">
                <circle cx="5" cy="5" r="4" fill="#008080"/>
              </svg>
              Teal + Gold match
            </div>
          </div>
        </a>

        <!-- Backdrop (ghost — no color suggestion yet) -->
        <a href="02-color-one.html?shape=backdrop" class="suggestion-card suggestion-card__ghost">
          <div class="suggestion-card__illustration">
            <svg viewBox="0 0 80 70" xmlns="http://www.w3.org/2000/svg">
              <rect x="8" y="8" width="64" height="54" rx="4" fill="#F4F4F4" stroke="#D0D0D0" stroke-width="1.5"/>
              <circle cx="24" cy="24" r="8" fill="#D8D8D8"/>
              <circle cx="40" cy="24" r="8" fill="#E0E0E0"/>
              <circle cx="56" cy="24" r="8" fill="#D8D8D8"/>
              <circle cx="24" cy="42" r="8" fill="#E0E0E0"/>
              <circle cx="40" cy="42" r="8" fill="#D8D8D8"/>
              <circle cx="56" cy="42" r="8" fill="#E0E0E0"/>
            </svg>
          </div>
          <div class="suggestion-card__body">
            <div class="suggestion-card__name">Backdrop</div>
            <div class="suggestion-card__match" style="color: #B0B0B0;">Pick your colors</div>
          </div>
        </a>

        <!-- Bouquet (ghost) -->
        <a href="02-color-one.html?shape=bouquet" class="suggestion-card suggestion-card__ghost">
          <div class="suggestion-card__illustration">
            <svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
              <circle cx="35" cy="16" r="12" fill="#D8D8D8"/>
              <circle cx="18" cy="35" r="10" fill="#E0E0E0"/>
              <circle cx="52" cy="35" r="10" fill="#D8D8D8"/>
              <circle cx="26" cy="54" r="9"  fill="#E0E0E0"/>
              <circle cx="44" cy="54" r="9"  fill="#D8D8D8"/>
              <line x1="35" y1="62" x2="35" y2="70" stroke="#CCC" stroke-width="2"/>
            </svg>
          </div>
          <div class="suggestion-card__body">
            <div class="suggestion-card__name">Bouquet</div>
            <div class="suggestion-card__match" style="color: #B0B0B0;">Pick your colors</div>
          </div>
        </a>

      </div><!-- /suggestion-row -->

    </div><!-- /upsell-suggestions -->

    <!-- Skip / back -->
    <div style="padding: 8px 24px 32px; text-align: center; border-top: 1px solid #E8E8E8;">
      <a href="04-composition.html" class="btn btn--text">
        My design is complete — talk to Jeff
      </a>
    </div>

  </div><!-- /lt-page -->

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
