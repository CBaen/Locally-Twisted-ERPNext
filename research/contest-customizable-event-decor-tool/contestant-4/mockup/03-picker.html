<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker — Design Studio | Locally Twisted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* This screen shows the picker in its open state as a static illustration */
    /* On mobile the picker is a bottom sheet; this screen simulates it open */

    .picker-screen-wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: white;
    }

    /* Mini arch preview above the picker */
    .picker-preview-bar {
      background: #FAFAFA;
      border-bottom: 1px solid #E8E8E8;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .picker-preview-bar__shape {
      flex-shrink: 0;
    }

    .picker-preview-bar__info {
      flex: 1;
    }

    .picker-preview-bar__region-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #B0B0B0;
      margin-bottom: 4px;
    }

    .picker-preview-bar__color-display {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .picker-preview-bar__swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #E8E8E8;
    }

    .picker-preview-bar__name {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      color: #1A1A1A;
    }

    .picker-preview-bar__hex {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #999;
    }

    /* The picker itself — shown inline (not as bottom sheet) for this standalone screen */
    .picker-inline {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .picker-inline__handle-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 0;
    }

    .picker-inline__title {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      color: #1A1A1A;
    }

    /* Selected swatch annotation */
    .selected-annotation {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1A1A1A;
      color: white;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
    }

    .selected-annotation::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: #1A1A1A;
    }

    /* Region tab buttons */
    .region-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid #E8E8E8;
    }

    .region-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 100px;
      border: 1.5px solid #E8E8E8;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #595A5C;
      transition: all 0.15s ease;
    }

    .region-tab.active {
      border-color: #1A1A1A;
      color: #1A1A1A;
      background: white;
    }

    .region-tab__dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
    }

    /* Desktop: side-by-side layout */
    @media (min-width: 768px) {
      .picker-screen-wrap {
        flex-direction: row;
        align-items: stretch;
      }

      .picker-preview-bar {
        flex-direction: column;
        align-items: flex-start;
        width: 260px;
        border-right: 1px solid #E8E8E8;
        border-bottom: none;
        padding: 32px 24px;
      }

      .picker-preview-bar__shape {
        margin-bottom: 16px;
      }

      .picker-inline {
        flex: 1;
      }
    }
  </style>
</head>
<body data-page="picker">

  <div class="lt-page" style="max-width: 600px;">

    <!-- Header -->
    <header class="lt-header">
      <a href="02-color-one.html" class="lt-header__back">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        Arch
      </a>
      <span class="lt-header__title">Pick a Color</span>
      <button style="font-size:13px; font-weight:600; color:#1A1A1A; background:none; border:none; cursor:pointer; padding:8px;">Done</button>
    </header>

    <div class="picker-screen-wrap">

      <!-- Preview bar: shows current arch + selected color -->
      <div class="picker-preview-bar">
        <div class="picker-preview-bar__shape">
          <!-- Tiny arch preview -->
          <svg viewBox="0 0 160 100" width="140" height="88" xmlns="http://www.w3.org/2000/svg">
            <!-- Primary balloons highlighted with active glow -->
            <g id="preview-primary">
              <circle cx="18"  cy="78" r="11" fill="#E8A0A0"/>
              <circle cx="17"  cy="58" r="10" fill="#E8A0A0"/>
              <circle cx="28"  cy="40" r="10" fill="#E8A0A0"/>
              <circle cx="46"  cy="24" r="11" fill="#E8A0A0"/>
              <circle cx="80"  cy="16" r="12" fill="#E8A0A0"/>
              <circle cx="114" cy="24" r="11" fill="#E8A0A0"/>
              <circle cx="132" cy="40" r="10" fill="#E8A0A0"/>
              <circle cx="143" cy="58" r="10" fill="#E8A0A0"/>
              <circle cx="142" cy="78" r="11" fill="#E8A0A0"/>
            </g>
            <!-- Accent highlighted (active) — slightly brighter -->
            <g id="preview-accent">
              <circle cx="17"  cy="68" r="8"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
              <circle cx="22"  cy="48" r="8"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
              <circle cx="36"  cy="32" r="9"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
              <circle cx="62"  cy="18" r="9"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
              <circle cx="98"  cy="18" r="9"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
              <circle cx="124" cy="32" r="9"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
              <circle cx="138" cy="48" r="8"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
              <circle cx="143" cy="68" r="8"  fill="#C3DCF3" stroke="#1A1A1A" stroke-width="2"/>
            </g>
          </svg>
        </div>

        <div class="picker-preview-bar__info">
          <div class="picker-preview-bar__region-label">Coloring</div>
          <div class="picker-preview-bar__color-display">
            <div class="picker-preview-bar__swatch" id="preview-swatch" style="background: #C3DCF3;"></div>
            <div>
              <div class="picker-preview-bar__name" id="preview-name">Soft Blue</div>
              <div class="picker-preview-bar__hex" id="preview-hex">#C3DCF3</div>
            </div>
          </div>
        </div>

        <!-- Region tabs -->
        <div class="region-tabs" style="padding: 12px 0 0; border-bottom: none; flex-wrap: wrap;">
          <button class="region-tab" data-region="primary">
            <span class="region-tab__dot" style="background: #E8A0A0;"></span>
            Main
          </button>
          <button class="region-tab active" data-region="accent">
            <span class="region-tab__dot" style="background: #C3DCF3;"></span>
            Accent
          </button>
        </div>
      </div><!-- /preview bar -->

      <!-- Picker content -->
      <div class="picker-inline">

        <!-- Recently used row -->
        <div style="padding: 16px 20px 12px; border-bottom: 1px solid #E8E8E8;">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #B0B0B0; margin-bottom: 10px;">
            Recently Used
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <!-- Populated swatches (simulating previous picks) -->
            <div class="swatch-circle" style="background: #E8A0A0;" title="Rose"></div>
            <div class="swatch-circle" style="background: #D4A017;" title="Gold"></div>
            <div class="swatch-circle" style="background: #008080;" title="Teal"></div>
            <div class="swatch-circle" style="background: #FFFFFF;" title="White"></div>
            <div class="swatch-circle empty"></div>
            <div class="swatch-circle empty"></div>
            <div class="swatch-circle empty"></div>
            <div class="swatch-circle empty"></div>
          </div>
        </div>

        <!-- Full grid -->
        <div style="padding: 16px 20px; overflow-y: auto; flex: 1;">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #B0B0B0; margin-bottom: 12px;">
            All Balloon Colors
          </div>

          <!-- Static grid rendered inline for this standalone screen -->
          <!-- Shows hex badge annotation on the currently selected item -->
          <div class="swatch-grid" id="static-palette">
            <!-- Populated by JS below -->
          </div>
        </div>

        <!-- Bottom action -->
        <div style="padding: 12px 20px 24px; border-top: 1px solid #E8E8E8; background: white; position: sticky; bottom: 0;">
          <a href="02-color-one.html" class="btn btn--primary btn--full">Apply Color</a>
        </div>

      </div><!-- /picker-inline -->

    </div><!-- /picker-screen-wrap -->

  </div><!-- /lt-page -->

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
  <script>
    $(document).ready(function() {
      // Render the palette grid statically on this page
      var $grid = $('#static-palette');
      var selectedHex = '#C3DCF3'; // Currently selecting accent

      LT_COLORS.forEach(function(c) {
        var isLight = c.hex === '#FFFFFF' || c.hex === '#FFFFF0' || c.hex === '#F4DFD7' || c.hex === '#B8FF9E' || c.hex === '#F9F871' || c.hex === '#88FED0' || c.hex === '#A0E9FF' || c.hex === '#C3DCF3';
        var isSelected = c.hex === selectedHex;
        var borderColor = isLight ? '#D0D0D0' : c.hex;

        var $item = $('<div class="swatch-item' + (isSelected ? ' selected' : '') + '" data-hex="' + c.hex + '">');

        var $circle = $('<div class="swatch-item__circle" style="background:' + c.hex + '; border-color:' + borderColor + ';">');

        // Hex badge — only show on selected by default
        var $badge = $('<span style="position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#1A1A1A; color:white; font-size:11px; font-weight:600; font-family:\'Courier New\',monospace; padding:4px 8px; border-radius:4px; white-space:nowrap; z-index:10; ' + (isSelected ? 'opacity:1;' : 'opacity:0;') + '">' + c.hex + '</span>');

        $circle.css('position', 'relative');
        $circle.append($badge);
        $item.append($circle);
        $item.append($('<span class="swatch-item__name">').text(c.name));
        $grid.append($item);
      });

      // Interaction
      $(document).on('click', '.swatch-item', function() {
        var hex = $(this).data('hex');
        selectedHex = hex;

        $('.swatch-item').removeClass('selected');
        $('.swatch-item span:last-child').css('opacity', 0); // hide all badges
        $(this).addClass('selected');
        $(this).find('span:first-child span').css('opacity', 1); // show badge

        var found = LT_COLORS.find(function(c) { return c.hex === hex; });
        $('#preview-swatch').css('background', hex);
        $('#preview-name').text(found ? found.name : hex);
        $('#preview-hex').text(hex);

        // Update preview arch
        $('#preview-accent circle').attr('fill', hex);
      });

      // Region tab switch
      $('.region-tab').on('click', function() {
        $('.region-tab').removeClass('active');
        $(this).addClass('active');
        var region = $(this).data('region');
        var currentHex = region === 'accent' ? '#C3DCF3' : '#E8A0A0';
        selectedHex = currentHex;
        $('#preview-swatch').css('background', currentHex);
        var found = LT_COLORS.find(function(c) { return c.hex === currentHex; });
        $('#preview-name').text(found ? found.name : currentHex);
        $('#preview-hex').text(currentHex);
        $('.swatch-item').removeClass('selected');
        $('.swatch-item[data-hex="' + currentHex + '"]').addClass('selected');
      });
    });
  </script>
</body>
</html>
