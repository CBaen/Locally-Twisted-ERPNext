<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Playground</title>
  </head>
  <body>
    <main class="epg-shell" data-event-playground-ready="false">
      <canvas id="event-playground-canvas" aria-label="Event Playground scene"></canvas>

      <header class="epg-topbar">
        <div class="epg-brand">
          <p>Locally Twisted</p>
          <h1>Event Playground</h1>
        </div>
        <label class="epg-level">
          <span>Venue</span>
          <select data-control="level"></select>
        </label>
        <nav class="epg-tools" aria-label="Scene tools">
          <button type="button" data-tool="view" aria-pressed="true">View</button>
          <button type="button" data-tool="move" aria-pressed="false">Move</button>
          <button type="button" data-tool="rotate" aria-pressed="false">Rotate</button>
          <button type="button" data-tool="stage" aria-pressed="false">Stage</button>
        </nav>
      </header>

      <section class="epg-palette" aria-label="Decor and props">
        <div>
          <p>Decor</p>
          <div class="epg-button-grid" data-palette="pieces"></div>
        </div>
        <div>
          <p>Props</p>
          <div class="epg-button-grid" data-palette="props"></div>
        </div>
      </section>

      <aside class="epg-drawer" aria-label="Selected item">
        <div class="epg-drawer__heading">
          <p>Selected</p>
          <h2 data-status="selected">Classic Arch</h2>
        </div>
        <dl class="epg-stats">
          <div>
            <dt>Pieces</dt>
            <dd data-status="piece-count">3</dd>
          </div>
          <div>
            <dt>Stage</dt>
            <dd data-status="stage-turn">0 deg</dd>
          </div>
        </dl>

        <div class="epg-section">
          <p>Color</p>
          <div class="epg-swatches" data-control="colors"></div>
        </div>

        <div class="epg-section">
          <p>Pattern</p>
          <div class="epg-segmented" data-control="patterns"></div>
        </div>

        <div class="epg-section">
          <p>Finish</p>
          <select data-control="material"></select>
        </div>

        <div class="epg-section">
          <p>Size</p>
          <div class="epg-segmented">
            <button type="button" data-size="small">Small</button>
            <button type="button" data-size="medium">Medium</button>
            <button type="button" data-size="large">Large</button>
          </div>
        </div>

        <div class="epg-actions">
          <button type="button" data-action="rotate-left" aria-label="Rotate left">-15</button>
          <button type="button" data-action="rotate-right" aria-label="Rotate right">+15</button>
          <button type="button" data-action="duplicate">Duplicate</button>
          <button type="button" data-action="delete">Delete</button>
        </div>

        <div class="epg-section">
          <p>Suggestions</p>
          <div class="epg-suggestions" data-control="suggestions"></div>
        </div>

        <form class="epg-contact" data-contact-form>
          <input name="customer_name" type="text" autocomplete="name" placeholder="Name" />
          <input name="email" type="email" autocomplete="email" placeholder="Email" />
          <input name="phone" type="tel" autocomplete="tel" placeholder="Phone" />
          <div class="epg-actions">
            <button type="button" data-action="save-draft">Save Draft</button>
            <button type="button" data-action="submit-inquiry">Submit Inquiry</button>
          </div>
        </form>
        <p class="epg-note" data-status="api">Final quote and install details are confirmed by Locally Twisted.</p>
      </aside>
    </main>
    <script type="module" src="/src/main-event-playground.js"></script>
  </body>
</html>
