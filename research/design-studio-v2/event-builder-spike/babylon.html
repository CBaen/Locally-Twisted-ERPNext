<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Builder Spike - Babylon.js</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="builder-shell" data-render-ready="false">
      <section class="scene-panel">
        <div class="scene-toolbar">
          <div>
            <p class="eyebrow">Corporate stage</p>
            <h1>Isometric event builder</h1>
          </div>
          <nav class="engine-switch" aria-label="Engine comparison">
            <a href="/playcanvas.html">PlayCanvas</a>
            <a href="/babylon.html" aria-current="page">Babylon.js</a>
          </nav>
        </div>
        <div class="scene-frame" data-render-root>
          <canvas id="scene-canvas" data-scene-canvas aria-label="Fixed isometric corporate stage"></canvas>
        </div>
      </section>
      <aside class="payload-panel">
        <div>
          <p class="eyebrow">Engine</p>
          <h2 data-engine-name>Babylon.js</h2>
        </div>
        <dl class="facts">
          <div>
            <dt>Stage</dt>
            <dd>24 ft x 12 ft</dd>
          </div>
          <div>
            <dt>Camera</dt>
            <dd>Fixed isometric</dd>
          </div>
          <div>
            <dt>Grid</dt>
            <dd>1 ft tiles</dd>
          </div>
        </dl>
        <pre data-payload-output aria-label="Scene payload"></pre>
      </aside>
    </main>
    <script type="module" src="/src/main-babylon.js"></script>
  </body>
</html>
